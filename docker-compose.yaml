services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insia}
      POSTGRES_USER: ${POSTGRES_USER:-insia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insia} -d ${POSTGRES_DB:-insia}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-insia}:${POSTGRES_PASSWORD:-insia}@db:5432/${POSTGRES_DB:-insia}
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Paris}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      ASSISTANT_MAX_ROUNDS: ${ASSISTANT_MAX_ROUNDS:-10}
      ICS_SOURCES: ${ICS_SOURCES:-}
      REMINDER_MINUTES: ${REMINDER_MINUTES:-30}
      SYNC_TIME: ${SYNC_TIME:-07:00}
      WEEKLY_SCHEDULE_TIME: ${WEEKLY_SCHEDULE_TIME:-12:00}
      METEO_EVENING_TIME: ${METEO_EVENING_TIME:-20:00}
      DEFAULT_METEO_LOCATION: ${DEFAULT_METEO_LOCATION:-Villeurbanne, France}
      DEFAULT_METEO_LATITUDE: ${DEFAULT_METEO_LATITUDE:-45.7719}
      DEFAULT_METEO_LONGITUDE: ${DEFAULT_METEO_LONGITUDE:-4.8902}
      COMMAND_GUILD_ID: ${COMMAND_GUILD_ID:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')\"" ]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_OWNER_ID: ${NEXT_PUBLIC_OWNER_ID:-1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_API_URL: http://backend:8000
      NEXT_PUBLIC_OWNER_ID: ${NEXT_PUBLIC_OWNER_ID:-1}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  